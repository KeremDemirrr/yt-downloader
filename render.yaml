services:
  - type: web
    name: yt-downloader
    runtime: node
    buildCommand: npm install && (pip install --user yt-dlp yt-dlp-get-pot bgutil-ytdlp-pot-provider || pip3 install yt-dlp yt-dlp-get-pot bgutil-ytdlp-pot-provider || true)
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: "true"
    autoDeploy: true
