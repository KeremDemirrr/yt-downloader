services:
  - type: web
    name: yt-downloader
    runtime: node
    buildCommand: npm install && pip install yt-dlp --user || pip3 install yt-dlp || echo "yt-dlp install failed"
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: "true"
    autoDeploy: true
